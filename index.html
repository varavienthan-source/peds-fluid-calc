<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2444">

<!-- PWA / iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peds Neph">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Paediatric Nephrology Calculator</title>

<style>
:root {
  --navy: #0f2444;
  --blue: #1e4d9b;
  --blue-bright: #2d5fc4;
  --bg: #eef3fa;
  --surface: #ffffff;
  --text: #1a2b4a;
  --muted: #6b88ad;
  --muted-soft: #7a9cc8;
  --border: #dce8f8;
  --border-soft: #e8f0fb;

  --normal: #0d7a4f;
  --normal-bg: #e6f6ee;
  --info: #1e4d9b;
  --info-bg: #e8f0fb;
  --warn: #9a6100;
  --warn-bg: #fff4e0;
  --danger: #b3261e;
  --danger-bg: #fdecea;

  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 2px 12px rgba(30,60,114,0.10);
  --shadow-lg: 0 4px 20px rgba(15,36,68,0.30);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
  line-height: 1.5;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  color: white;
  padding: 14px 20px 18px;
  padding-top: calc(14px + env(safe-area-inset-top));
  text-align: center;
  box-shadow: var(--shadow-lg);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-badge {
  display: inline-block;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  padding: 3px 12px;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin-bottom: 7px;
  color: rgba(255,255,255,0.85);
}
.header h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
.header p { font-size: 0.76rem; color: rgba(255,255,255,0.62); margin-top: 2px; }

.disclaimer {
  background: var(--navy);
  color: rgba(255,255,255,0.72);
  font-size: 0.7rem;
  text-align: center;
  padding: 7px 16px;
  line-height: 1.4;
}

/* ── Container ── */
.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 14px;
  padding-bottom: calc(40px + env(safe-area-inset-bottom));
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
  margin-bottom: 14px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto;
  padding: 9px 15px;
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 50px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: inherit;
  transition: all 0.2s ease;
  background: var(--surface);
  color: var(--muted-soft);
  white-space: nowrap;
  -webkit-user-select: none;
  user-select: none;
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(30,77,155,0.35);
}

/* ── Search ── */
.search-wrap { margin-bottom: 14px; }
.search-input {
  width: 100%;
  padding: 13px 16px;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 0.95rem;
  font-family: inherit;
  color: var(--text);
  -webkit-appearance: none;
  appearance: none;
}
.search-input:focus { outline: 2px solid var(--blue-bright); outline-offset: -1px; }

/* ── Calculator list ── */
.calc-card {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.calc-card:active { transform: scale(0.99); }
.calc-card-title { font-size: 1rem; font-weight: 700; color: var(--navy); }
.calc-card-meta {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--muted-soft); margin-top: 2px;
}
.calc-card-formula {
  display: block; margin-top: 8px; font-size: 0.76rem;
  color: var(--muted); background: var(--bg);
  padding: 7px 10px; border-radius: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow-x: auto; white-space: nowrap;
}

/* ── Detail ── */
.detail-header { margin: 12px 0 16px; }
.detail-title { font-size: 1.25rem; font-weight: 800; color: var(--navy); letter-spacing: -0.3px; }
.detail-source { font-size: 0.76rem; color: var(--muted); margin-top: 4px; }

.input-card, .results-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-label {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--muted-soft); margin-bottom: 12px;
}

.input-group { margin-bottom: 14px; }
.input-group:last-child { margin-bottom: 0; }
.input-group label { display: block; font-size: 0.84rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-field {
  flex: 1; width: 100%;
  padding: 12px 14px; min-height: 48px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 1rem; font-family: inherit; color: var(--text);
  background: var(--surface);
  -webkit-appearance: none; appearance: none;
}
.input-field:focus { outline: 2px solid var(--blue-bright); outline-offset: -1px; }
select.input-field { background-image: none; }
.unit-select { flex: 0 0 auto; min-width: 104px; font-size: 0.88rem; }
.unit-static { flex: 0 0 auto; font-size: 0.85rem; color: var(--muted); min-width: 68px; }
.input-help { font-size: 0.74rem; color: var(--muted); margin-top: 5px; }
.checkbox-wrap { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 0.9rem; min-height: 44px; }
.checkbox-wrap input { width: 22px; height: 22px; accent-color: var(--blue); }

/* ── Result ── */
.result-head { text-align: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft); }
.result-label {
  font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.1px; color: var(--muted-soft); margin-bottom: 6px;
}
.result-value-row { display: flex; align-items: baseline; justify-content: center; gap: 7px; flex-wrap: wrap; }
.result-value { font-size: 2.4rem; font-weight: 800; color: var(--navy); letter-spacing: -1.5px; line-height: 1.1; }
.result-unit { font-size: 0.95rem; font-weight: 600; color: var(--muted); }

.interp { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.88rem; }
.interp-text { font-weight: 700; }
.interp-detail { margin-top: 4px; font-size: 0.82rem; opacity: 0.9; }
.interp-normal { background: var(--normal-bg); color: var(--normal); }
.interp-info   { background: var(--info-bg);   color: var(--info); }
.interp-warn   { background: var(--warn-bg);   color: var(--warn); }
.interp-danger { background: var(--danger-bg); color: var(--danger); }

.warn-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.warn {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-size: 0.82rem; line-height: 1.45; font-weight: 600;
}
.warn-icon { flex: 0 0 auto; }
.warn-info   { background: var(--info-bg);   color: var(--info); }
.warn-warn   { background: var(--warn-bg);   color: var(--warn); }
.warn-danger { background: var(--danger-bg); color: var(--danger); }

.extra-grid {
  margin-top: 14px; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;
}
.extra-item { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; }
.extra-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
.extra-value { font-size: 1.02rem; font-weight: 700; color: var(--navy); margin-top: 2px; }
.extra-unit { font-size: 0.74rem; font-weight: 600; color: var(--muted); }

/* ── Show the work ── */
.work { margin-top: 16px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
.work-summary {
  cursor: pointer; font-size: 0.84rem; font-weight: 700; color: var(--blue);
  padding: 10px 0; min-height: 44px; display: flex; align-items: center; list-style: none;
}
.work-summary::-webkit-details-marker { display: none; }
.work-summary::before { content: '▸ '; margin-right: 6px; transition: transform 0.2s; }
.work[open] .work-summary::before { content: '▾ '; }
.work-section { margin-bottom: 16px; }
.work-heading {
  font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.1px; color: var(--muted-soft); margin-bottom: 8px;
}
.formula {
  display: block; background: var(--navy); color: #cfe0f7;
  padding: 12px 14px; border-radius: var(--radius-sm);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.8rem; line-height: 1.6; overflow-x: auto;
}
.steps { list-style: none; counter-reset: stepc; }
.step {
  counter-increment: stepc; position: relative;
  padding: 10px 0 10px 30px; border-bottom: 1px solid var(--border-soft);
}
.step:last-child { border-bottom: none; }
.step::before {
  content: counter(stepc);
  position: absolute; left: 0; top: 10px;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--blue); color: white;
  font-size: 0.68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.step-label { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.step-calc {
  margin-top: 5px; display: flex; gap: 7px; align-items: baseline;
  flex-wrap: wrap; font-size: 0.8rem;
}
.step-expr {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--bg); padding: 3px 7px; border-radius: 6px; color: var(--muted);
}
.step-arrow { color: var(--muted-soft); font-weight: 700; }
.step-result { color: var(--navy); font-weight: 700; }

.considerations { padding-left: 18px; }
.considerations li { font-size: 0.83rem; line-height: 1.55; margin-bottom: 8px; color: var(--text); }
.references { padding-left: 18px; margin-top: 6px; }
.references li { font-size: 0.75rem; line-height: 1.5; color: var(--muted); margin-bottom: 4px; }
.source { font-size: 0.78rem; color: var(--muted); font-weight: 600; }

.result-error {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--danger-bg); color: var(--danger);
  padding: 14px 16px; border-radius: var(--radius-sm);
  font-size: 0.88rem; font-weight: 600; line-height: 1.45;
}

.empty-state { text-align: center; padding: 28px 16px; color: var(--muted-soft); font-size: 0.88rem; }

/* ── Buttons ── */
.action-buttons { display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px 16px; min-height: 48px;
  border: none; border-radius: var(--radius-sm);
  font-size: 0.88rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: opacity 0.15s;
}
.btn:active { opacity: 0.75; }
.btn-copy { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); color: white; }
.btn-reset { background: var(--surface); color: var(--muted); border: 1px solid var(--border); flex: 0 0 auto; padding: 10px 16px; min-height: 44px; }

/* ── Calculator tab ── */
.calc-display {
  width: 100%; padding: 16px; min-height: 62px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 1.5rem; font-weight: 700; text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--navy); background: var(--bg);
}
.calc-display:focus { outline: 2px solid var(--blue-bright); outline-offset: -1px; }
.calc-preview {
  text-align: right; font-size: 0.95rem; font-weight: 700;
  color: var(--muted); min-height: 26px; padding: 6px 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.calc-preview.calc-error { color: var(--danger); font-size: 0.8rem; font-weight: 600; }
.calc-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.calc-key {
  padding: 16px 0; min-height: 56px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--navy);
  font-size: 1.15rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background 0.12s;
}
.calc-key:active { background: var(--border-soft); }
.calc-key-op { background: var(--info-bg); color: var(--blue); }
.calc-key-fn { background: var(--bg); color: var(--muted); }
.calc-key-equals { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); color: white; border-color: transparent; }
.calc-tape { margin-bottom: 14px; }
.tape-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 9px 12px; background: var(--surface);
  border: 1px solid var(--border-soft); border-radius: 10px; margin-bottom: 6px;
  font-size: 0.82rem; cursor: pointer;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.tape-expr { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.tape-value { color: var(--navy); font-weight: 700; flex: 0 0 auto; }

/* ── Install banner ── */
.install-banner {
  display: none; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 15px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.install-banner.show { display: flex; }
.install-banner-text { flex: 1; font-size: 0.85rem; font-weight: 700; color: var(--navy); }
.install-banner-text span { display: block; font-size: 0.75rem; font-weight: 500; color: var(--muted); margin-top: 2px; }
.install-btn {
  border: none; background: var(--blue); color: white;
  padding: 9px 15px; border-radius: 50px; min-height: 40px;
  font-size: 0.8rem; font-weight: 700; font-family: inherit; cursor: pointer;
}

@media (max-width: 380px) {
  .header h1 { font-size: 1.25rem; }
  .result-value { font-size: 2rem; }
  .extra-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">Clinical Reference</div>
  <h1>Paediatric Nephrology</h1>
  <p>Canadian SI units · CAPN Resident Handbook 2021</p>
</div>
<div class="disclaimer">
  Clinical decision support only. Verify every result against local protocol and clinical judgement.
</div>

<div class="container">

  <div class="install-banner" id="installBanner">
    <span style="font-size:1.4rem">📲</span>
    <div class="install-banner-text">
      Add to Home Screen
      <span>Tap Share → "Add to Home Screen" to install as an app</span>
    </div>
    <button class="install-btn" type="button">Got it</button>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="search-wrap" id="searchWrap">
    <input type="search" class="search-input" id="search"
           placeholder="Search all calculators…" autocomplete="off" aria-label="Search calculators">
  </div>

  <div id="list"></div>
  <div id="detail" style="display:none"></div>

</div>

<script type="module">
  import { init } from './src/app.js';
  init();
</script>

</body>
</html>
